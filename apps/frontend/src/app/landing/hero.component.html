<section class="lp-hero">
  <!-- Near-flat warm glow: gives the glass nav something to blur at scroll 0 -->
  <div class="lp-hero__glow" aria-hidden="true"></div>

  <div class="lp-container">
    <div class="lp-hero__inner">
      <span class="lp-badge">
        <span class="lp-badge__tile">
          <span class="material-symbols-outlined">calendar_month</span>
        </span>
        Planificador semanal de comidas
      </span>

      <h1 class="lp-hero__title">
        <span class="lp-hero__title-muted">Domina tu cocina,</span>
        <span class="lp-hero__title-strong">simplifica tu vida</span>
      </h1>

      <p class="lp-hero__sub">
        Planifica tus comidas, gestiona tu despensa y genera la lista de la compra en segundos.
      </p>

      <div class="lp-hero__actions">
        <a routerLink="/register" class="lp-btn lp-btn--solid">
          Crear cuenta
          <span class="material-symbols-outlined">arrow_forward</span>
        </a>
        <a routerLink="/login" class="lp-btn lp-btn--outline">Iniciar sesión</a>
      </div>
    </div>
  </div>

  <!-- Product screenshot: swappable placeholder slot, clipped by the fold -->
  <div class="lp-container lp-hero__shot">
    <div class="lp-frame">
      <img
        src="/app-preview-placeholder.png"
        alt="Vista previa de MealMap con el plan semanal de comidas"
        width="1600"
        height="1000"
        fetchpriority="high"
      />
    </div>
  </div>
</section>
