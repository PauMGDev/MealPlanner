<header
  class="fixed top-0 inset-x-0 z-50 bg-surface dark:bg-surface-container border-b border-outline-variant/30 transition-shadow duration-200"
  [class.shadow-sm]="scrolled()">
  <nav class="navbar-inner">

    <!-- Logo -->
    <a routerLink="/" class="navbar-logo">
      <span class="material-symbols-outlined icon-fill text-primary text-3xl">restaurant_menu</span>
      <span class="font-sans text-2xl font-semibold text-primary">MealMap</span>
    </a>

    <!-- Desktop links -->
    <div class="navbar-links">
      <a href="#features" class="navbar-link--active">Características</a>
      <a href="#preview" class="navbar-link">Recetas</a>
    </div>

    <!-- Controls -->
    <div class="navbar-controls">
      <a routerLink="/login" class="navbar-login">Iniciar sesión</a>
      <a routerLink="/register" class="navbar-register">Empezar</a>
      <button type="button" (click)="toggleTheme()" class="navbar-icon-btn" aria-label="Cambiar tema">
        <span class="material-symbols-outlined">{{ theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</span>
      </button>
      <button type="button" (click)="toggleMenu()" class="navbar-icon-btn md:hidden" aria-label="Abrir menú">
        <span class="material-symbols-outlined text-3xl">{{ menuOpen() ? 'close' : 'menu' }}</span>
      </button>
    </div>
  </nav>

  <!-- Mobile menu -->
  <div class="collapsible md:hidden" [class.collapsed]="!menuOpen()">
    <div class="flex flex-col gap-1 px-4 pb-4">
      <a href="#features" (click)="closeMenu()" class="navbar-link--active py-2">Características</a>
      <a href="#preview" (click)="closeMenu()" class="navbar-mobile-link">Recetas</a>
      <a routerLink="/login" (click)="closeMenu()" class="navbar-mobile-link">Iniciar sesión</a>
      <a routerLink="/register" (click)="closeMenu()" class="navbar-mobile-register">Empezar</a>
    </div>
  </div>
</header>
