<header class="lp-nav">
  <nav class="lp-nav__pill" aria-label="Navegación principal">

    <a routerLink="/" class="lp-nav__brand">
      <span class="material-symbols-outlined icon-fill">restaurant_menu</span>
      MealMap
    </a>

    <div class="lp-nav__links">
      <a href="#caracteristicas" class="lp-nav__link">Características</a>
      <a href="#como-funciona" class="lp-nav__link">Cómo funciona</a>
      <a href="#preguntas" class="lp-nav__link">Preguntas</a>
    </div>

    <div class="lp-nav__actions">
      <a routerLink="/login" class="lp-nav__login">Iniciar sesión</a>
      <a routerLink="/register" class="lp-btn lp-btn--solid lp-nav__cta">Crear cuenta</a>
      <button
        type="button"
        class="lp-nav__burger"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="lp-nav-panel"
        [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'">
        <span class="material-symbols-outlined">{{ menuOpen() ? 'close' : 'menu' }}</span>
      </button>
    </div>
  </nav>

  <div id="lp-nav-panel" class="lp-nav__panel collapsible" [class.collapsed]="!menuOpen()">
    <div class="lp-nav__panel-inner">
      <a href="#caracteristicas" (click)="closeMenu()" class="lp-nav__panel-link">Características</a>
      <a href="#como-funciona" (click)="closeMenu()" class="lp-nav__panel-link">Cómo funciona</a>
      <a href="#preguntas" (click)="closeMenu()" class="lp-nav__panel-link">Preguntas</a>
      <a routerLink="/login" (click)="closeMenu()" class="lp-nav__panel-link">Iniciar sesión</a>
      <a routerLink="/register" (click)="closeMenu()" class="lp-btn lp-btn--solid mt-1">
        Crear cuenta
      </a>
    </div>
  </div>
</header>
