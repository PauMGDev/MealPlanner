<section class="hiw-section">
  <div class="max-w-7xl mx-auto">
    <div appReveal class="text-center mb-16 md:mb-20">
      <h2 class="hiw-heading">Simplifica tu rutina en 3 pasos</h2>
    </div>

    <div class="hiw-steps">
      <div class="hiw-connector" aria-hidden="true"></div>

      <div appReveal class="hiw-step">
        <div class="hiw-number">1</div>
        <h3 class="hiw-step-title">Planifica</h3>
        <p class="hiw-step-desc">Elige tus recetas para la semana en menos de 5 minutos.</p>
      </div>

      <div appReveal [appRevealDelay]="0.1" class="hiw-step">
        <div class="hiw-number">2</div>
        <h3 class="hiw-step-title">Cocina</h3>
        <p class="hiw-step-desc">Sigue instrucciones paso a paso optimizadas para cada plato.</p>
      </div>

      <div appReveal [appRevealDelay]="0.2" class="hiw-step">
        <div class="hiw-number">3</div>
        <h3 class="hiw-step-title">Disfruta</h3>
        <p class="hiw-step-desc">Ahorra tiempo y dinero mientras comes más saludable.</p>
      </div>
    </div>
  </div>
</section>
