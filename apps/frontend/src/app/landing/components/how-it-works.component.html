<section id="como-funciona" class="lp-section">
  <div class="lp-container">

    <div appReveal>
      <h2 class="lp-h2 max-w-xl">Simplifica tu rutina en 3 pasos</h2>
    </div>

    <div class="lp-steps">
      <div class="lp-steps__rail" aria-hidden="true"></div>

      @for (step of steps; track step.title; let i = $index) {
        <div appReveal [appRevealIndex]="i" class="lp-step">
          <span class="lp-step__node" aria-hidden="true"></span>
          <h3 class="lp-step__title">{{ step.title }}</h3>
          <p class="lp-step__desc">{{ step.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
