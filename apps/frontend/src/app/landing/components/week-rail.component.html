<section id="semana" class="lp-section">
  <div class="lp-container">

    <div appReveal class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <h2 class="lp-h2 max-w-lg">Tu semana entera, de un vistazo</h2>
      <p class="text-sm font-medium text-lp-ink-faint">Plan semanal · 16 al 22 de junio</p>
    </div>

    <div class="lp-rail" role="list">
      @for (day of days; track day.day; let i = $index) {
        <article
          appReveal
          [appRevealIndex]="i"
          role="listitem"
          class="lp-rail__card"
          [class.lp-rail__card--today]="day.today">
          <p class="lp-rail__day">
            {{ day.day }}
            @if (day.today) {
              <span class="lp-rail__today-tag">Hoy</span>
            }
          </p>
          <p class="lp-rail__meal">{{ day.meal }}</p>
          <p class="lp-rail__type">{{ day.type }}</p>
        </article>
      }
    </div>
  </div>
</section>
