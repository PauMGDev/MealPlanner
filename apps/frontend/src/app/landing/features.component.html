<section id="features" class="features-section">
  <div class="max-w-7xl mx-auto">

    <!-- Section header -->
    <div appReveal class="features-header">
      <span class="section-eyebrow">Características</span>
      <h2 class="section-title">Todo lo que necesitas para organizarte</h2>
    </div>

    <!-- Asymmetric bento: [3fr] tall featured | [2fr] three compact stacked -->
    <div appReveal [appRevealDelay]="0.08" class="features-grid">

      <!-- Featured: Planificación Visual — spans left 3 columns, 3 rows -->
      <app-feature-card
        class="lg:col-span-3 lg:row-span-3"
        icon="calendar_month"
        title="Planificación Visual"
        description="Calendario semanal interactivo con función de arrastrar y soltar para organizar tus menús sin esfuerzo."
        variant="primary"
        [featured]="true" />

      <!-- Compact: Recetario Inteligente -->
      <app-feature-card
        class="lg:col-span-2"
        icon="menu_book"
        title="Recetario Inteligente"
        description="Guarda tus platos favoritos y descubre nuevas ideas basadas en lo que ya tienes en casa."
        variant="secondary" />

      <!-- Compact: Despensa Conectada -->
      <app-feature-card
        class="lg:col-span-2"
        icon="kitchen"
        title="Despensa Conectada"
        description="Control total sobre tus ingredientes. Te avisamos cuando algo se está agotando o va a caducar."
        variant="tertiary" />

      <!-- Compact: Lista de la compra -->
      <app-feature-card
        class="lg:col-span-2"
        icon="shopping_cart"
        title="Lista de la compra"
        description="Generada automáticamente a partir del plan semanal y de lo que ya tienes en despensa."
        variant="primary" />

    </div>
  </div>
</section>
