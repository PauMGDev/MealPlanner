<section>
  <div class="flex items-center gap-2.5 mb-2.5 cursor-pointer select-none group/header"
       (click)="toggle.emit(group.id)">
    <span class="w-2.5 h-2.5 rounded-[3px] flex-shrink-0 bg-lp-accent"></span>
    <h2 class="text-[13px] font-semibold text-lp-ink-soft
               group-hover/header:text-lp-ink transition-colors whitespace-nowrap flex-shrink-0">
      {{ group.name }}
    </h2>
    @if (isCollapsed) {
      <p class="text-[10px] text-lp-ink-faint/50 truncate min-w-0">{{ collapsedPreview }}</p>
    }
    <div class="flex-1 h-px bg-lp-hover min-w-2"></div>
    <span class="text-xs font-data tabular-nums text-lp-ink-faint flex-shrink-0">{{ group.items.length }}</span>
    <svg [class]="chevronClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
    </svg>
  </div>

  <div [class]="isCollapsed ? 'collapsible collapsed' : 'collapsible'">
    <div>
      <div class="lp-rows rounded-r-2xl border-l-2 border-l-lp-line overflow-hidden bg-lp-tray">
        @for (item of group.items; track item.id) {
          <app-pantry-item
            [item]="item"
            (rowClick)="rowClick.emit($event)"
            (setDepleted)="setDepleted.emit($event)"
            (delete)="delete.emit($event)" />
        }
      </div>
    </div>
  </div>
</section>
