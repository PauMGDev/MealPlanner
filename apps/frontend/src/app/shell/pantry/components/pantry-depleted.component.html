<div class="mt-8 pt-6 border-t border-white/[0.05]">
  <div class="flex items-center gap-2.5 mb-4 cursor-pointer select-none group/header"
       (click)="toggle.emit('__depleted__')">
    <span class="w-2.5 h-2.5 rounded-[3px] bg-warning/70 flex-shrink-0"></span>
    <h2 class="text-[13px] font-semibold text-warning/70
               group-hover/header:text-warning transition-colors whitespace-nowrap flex-shrink-0">
      Agotados
    </h2>
    @if (isCollapsed) {
      <p class="text-[10px] text-mm-text3/50 truncate min-w-0">{{ collapsedPreview }}</p>
    }
    <div class="flex-1 h-px bg-white/[0.05] min-w-2"></div>
    <span class="text-xs font-data tabular-nums text-mm-text3 flex-shrink-0">{{ group.items.length }}</span>
    <svg [class]="chevronClass" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
    </svg>
  </div>

  <div [class]="isCollapsed ? 'collapsible collapsed' : 'collapsible'">
    <div>
      <div class="flex flex-wrap gap-2">
        @for (item of group.items; track item.id) {
          <div class="flex items-center gap-2 pl-3 pr-1.5 py-1.5 rounded-lg
                      bg-mm-surface
                      group/chip cursor-pointer
                      hover:bg-white/[0.04]
                      transition-all opacity-60 hover:opacity-90"
               (click)="rowClick.emit(item)">
            <span class="text-sm text-mm-text2 group-hover/chip:text-mm-text1 transition-colors whitespace-nowrap">
              {{ item.name }}
            </span>
            <span class="text-xs font-data tabular-nums text-mm-text3">{{ item.unit }}</span>
            <button (click)="$event.stopPropagation(); delete.emit(item)"
                    title="Eliminar"
                    class="p-0.5 rounded-md text-mm-text3 transition-colors
                           opacity-0 group-hover/chip:opacity-100
                           hover:text-danger hover:bg-danger/10 ml-0.5">
              <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</div>
