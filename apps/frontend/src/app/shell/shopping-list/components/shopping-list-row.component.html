<div class="notebook-row flex items-center gap-3 group">

  <button type="button"
          (click)="toggled.emit(item.id)"
          [attr.aria-pressed]="item.checked"
          [class.notebook-checkbox--checked]="item.checked"
          class="notebook-checkbox flex-shrink-0"
          aria-label="Marcar como comprado">
    @if (item.checked) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="w-3 h-3">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
    }
  </button>

  <span class="flex-1 truncate inline-block"
        [class.text-mm-text3]="item.checked"
        [class.notebook-strike]="item.checked">
    <span class="font-handwritten text-xl inline-block"
          [class.text-mm-text1]="!item.checked"
          [class.text-mm-text3]="item.checked"
          [style.transform]="'rotate(' + rotation + ')'">
      {{ item.name }}
    </span>
  </span>

  <input type="number" inputmode="decimal" min="0" step="any"
         [value]="item.quantity ?? ''"
         (change)="onQuantityChange($any($event.target).value)"
         placeholder="cant."
         aria-label="Cantidad"
         class="font-handwritten w-14 text-right bg-transparent border-b border-dashed border-white/15
                text-mm-text2 text-lg outline-none focus:border-blue-400/60 transition-colors
                placeholder:text-mm-text3 placeholder:text-sm" />

  @if (item.unit) {
    <span class="font-handwritten text-mm-text3 text-base w-10 truncate">{{ item.unit }}</span>
  }

  <button type="button" (click)="removed.emit(item.id)"
          class="opacity-0 group-hover:opacity-100 text-mm-text3 hover:text-red-400
                 transition-opacity p-1 flex-shrink-0"
          aria-label="Eliminar de la lista">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>
</div>
