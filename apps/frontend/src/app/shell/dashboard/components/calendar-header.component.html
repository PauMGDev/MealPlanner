<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
  <div>
    <h2 class="text-xl font-bold text-mm-text1 tracking-tight">Plan semanal</h2>
    <p class="text-sm text-mm-text3 mt-0.5 tabular-nums">{{ weekRangeLabel }}</p>
  </div>
  <div class="flex items-center gap-1 bg-mm-surface border border-white/[0.06] rounded-xl p-1 self-start sm:self-auto">
    <button (click)="prevWeek.emit()" title="Semana anterior"
            class="w-8 h-8 flex items-center justify-center rounded-lg text-mm-text2 hover:text-mm-text1 hover:bg-mm-card transition-all duration-150">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
    <button (click)="goToThisWeek.emit()" title="Semana actual"
            class="px-2.5 h-8 flex items-center justify-center rounded-lg text-mm-text3 hover:text-mm-text1 hover:bg-mm-card transition-all duration-150 text-xs font-semibold">
      Hoy
    </button>
    <button (click)="nextWeek.emit()" title="Semana siguiente"
            class="w-8 h-8 flex items-center justify-center rounded-lg text-mm-text2 hover:text-mm-text1 hover:bg-mm-card transition-all duration-150">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
      </svg>
    </button>
  </div>
</div>

<div class="flex flex-wrap gap-2 mb-5">
  @for (row of mealRows; track row.type) {
    <button (click)="toggleMealType.emit(row.type)"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all duration-150"
            [class]="isVisible(row.type) ? row.activePill : 'border-white/[0.06] text-mm-text3 opacity-40 hover:opacity-60'">
      <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" [class]="row.dot"></span>
      {{ row.label }}
    </button>
  }
</div>
