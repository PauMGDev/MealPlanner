<div class="lp-container">

  <header class="lp-page-head">
    <div>
      <h1 class="lp-page-title">Plan semanal</h1>
      <p class="lp-page-sub">{{ weekRangeLabel() }}</p>
    </div>

    <div class="lp-week-nav">
      <button type="button" class="lp-week-nav__arrow" (click)="prevWeek()" aria-label="Semana anterior">
        <span class="material-symbols-outlined">chevron_left</span>
      </button>
      <button type="button" class="lp-week-nav__today" (click)="goToThisWeek()"
              [disabled]="isCurrentWeek()">Hoy</button>
      <button type="button" class="lp-week-nav__arrow" (click)="nextWeek()" aria-label="Semana siguiente">
        <span class="material-symbols-outlined">chevron_right</span>
      </button>
    </div>
  </header>

  @if (calendarError()) {
    <div class="lp-app-alert mt-5" role="alert">
      <span class="flex items-center gap-2.5">
        <span class="material-symbols-outlined">error</span>
        {{ calendarError() }}
      </span>
      <button type="button" class="lp-icon-btn" (click)="calendarError.set('')" aria-label="Cerrar aviso">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>
  }

  @if (reappearedRows().length > 0) {
    <p class="mt-5 text-sm text-lp-ink-soft">
      {{ reappearedRows().join(', ') }} sigue{{ reappearedRows().length === 1 ? '' : 'n' }}
      en esta semana aunque la desactivaste en ajustes. Las comidas no se borran.
    </p>
  }

  <!-- Desktop and tablet: the full matrix -->
  <div class="mt-6 hidden md:block">
    <app-calendar-grid
      [weekDays]="weekDays()"
      [mealRows]="mealRows()"
      [mealGrid]="mealGrid()"
      [availability]="availability()"
      [loading]="loadingPlan()"
      (openDetail)="openDetail($event)"
      (openPicker)="openPicker($event)"
      (removeSlot)="removeSlot($event)"
      (moveMeal)="moveMeal($event)" />
  </div>

  <!-- Mobile: one day at a time -->
  <div class="mt-6 md:hidden">
    <app-day-view
      [weekDays]="weekDays()"
      [selectedDay]="selectedDay()"
      [mealRows]="mealRows()"
      [mealGrid]="mealGrid()"
      [availability]="availability()"
      [loading]="loadingPlan()"
      (selectDay)="selectDay($event)"
      (openDetail)="openDetail($event)"
      (openPicker)="openPicker($event)"
      (removeSlot)="removeSlot($event)" />
  </div>

  <div class="mt-3">
    <app-week-modules
      [needs]="needs()"
      [nextMeal]="nextMeal()"
      [todayInWeek]="todayInWeek()"
      [loading]="loadingPlan() || loadingContext()"
      [addingToList]="addingToList()"
      (addNeedsToList)="addNeedsToList($event)"
      (goToToday)="goToThisWeek()" />
  </div>

</div>

<app-meal-detail-modal
  [meal]="detailMeal()"
  [recipeDetail]="detailRecipe()"
  [loadingRecipe]="loadingDetail()"
  (closed)="closeDetail()"
  (switchRecipe)="onDetailSwitchRecipe($event)"
  (removed)="onDetailRemoved($event)" />

<app-recipe-picker-modal
  [show]="pickerOpen()"
  [slot]="pickerSlot()"
  [recipes]="recipes()"
  [loadingRecipes]="loadingContext()"
  (closed)="closePicker()"
  (selected)="assignRecipe($event)" />
