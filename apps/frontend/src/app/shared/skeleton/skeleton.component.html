@if (type === 'lines') {
  <div class="space-y-3">
    @for (i of rowsArray(); track i) {
      <div class="h-4 bg-mm-surface rounded-full animate-pulse" [class]="lineWidth(i)"></div>
    }
  </div>
} @else {
  <div class="grid gap-3" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr))">
    @for (i of rowsArray(); track i) {
      <div class="rounded-xl bg-mm-surface animate-pulse overflow-hidden">
        <div class="h-24 bg-mm-elevated"></div>
        <div class="p-3 space-y-2">
          <div class="h-3 bg-mm-elevated rounded-full w-3/4"></div>
          <div class="h-2.5 bg-mm-elevated rounded-full w-1/2"></div>
        </div>
      </div>
    }
  </div>
}
