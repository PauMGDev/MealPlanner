@if (open) {
  <div class="lp-modal-backdrop modal-backdrop-enter flex justify-center p-0 sm:p-4"
       [class]="backdropClasses"
       (click)="closed.emit()">
    <div class="lp-modal modal-enter flex w-full flex-col"
         [class]="panelClasses"
         (click)="$event.stopPropagation()">
      <ng-content />
    </div>
  </div>
}
