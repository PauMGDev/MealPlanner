<app-auth-shell
  title="Bienvenido de nuevo"
  subtitle="Introduce tus datos para continuar."
  footerText="¿No tienes cuenta?"
  footerLinkLabel="Crear cuenta"
  footerLink="/register">

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">

    <div class="lp-field">
      <label for="login-email" class="lp-label">Email</label>
      <input
        id="login-email"
        formControlName="email"
        type="email"
        autocomplete="email"
        placeholder="tu@email.com"
        class="auth-input" />
      @if (form.get('email')?.touched && form.get('email')?.hasError('email')) {
        <p class="lp-field-error">Introduce un email válido</p>
      }
    </div>

    <div class="lp-field">
      <label for="login-password" class="lp-label">Contraseña</label>
      <input
        id="login-password"
        formControlName="password"
        type="password"
        autocomplete="current-password"
        placeholder="••••••••"
        class="auth-input" />
    </div>

    @if (error()) {
      <div class="lp-alert" role="alert">
        <span class="material-symbols-outlined">error</span>
        <p>{{ error() }}</p>
      </div>
    }

    <button type="submit" [disabled]="loading()" class="lp-btn lp-btn--solid lp-btn--block mt-2">
      {{ loading() ? 'Iniciando sesión...' : 'Iniciar sesión' }}
    </button>

  </form>
</app-auth-shell>
