services:

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: mealplanner
      POSTGRES_USER: mealplanner
      POSTGRES_PASSWORD: mealplanner

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./apps/backend

    ports:
      - "3000:3000"
      - "5555:5555"

    depends_on:
      - postgres

    environment:
      DATABASE_URL: postgresql://mealplanner:mealplanner@postgres:5432/mealplanner
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}

  frontend:
    build:
      context: ./apps/frontend

    ports:
      - "4200:80"

    depends_on:
      - backend

volumes:
  postgres_data: